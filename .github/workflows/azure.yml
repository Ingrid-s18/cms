name: Deploy Laravel a Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_mysql, gd, intl, zip, fileinfo

      - name: Instalar dependencias PHP
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Empaquetar
        run: zip -r release.zip . -x ".git/*" "node_modules/*" "tests/*" ".github/*" ".env"

      - name: Desplegar
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip